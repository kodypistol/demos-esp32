<!doctype html>
<meta charset="utf-8">
<title>LED</title>

<input id="brightness" type="range" min="0" max="255" value="0">

<script>
  const ws = new WebSocket("ws://localhost:8080")
  const slider = document.querySelector("#brightness")

  function sendBrightness() {
    ws.send("led:" + slider.value)
  }

  slider.addEventListener("input", sendBrightness)
</script>
